<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Confirmados · Típicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFDF8;--card-2:#FBF4E6;
  --brd-2:rgba(61,36,24,0.18);
  --brd-gold:rgba(201,146,59,0.30);--brd-gold-hi:rgba(201,146,59,0.55);
  --em:#C9923B;--em-2:#E8B554;--em-3:#9C6F27;
  --brand-dark:#3D2418;--brand-mid:#6B3D24;--brand-warm:#8B5A2B;
  --txt:#3D2418;--mu:#9C7E5E;--mu-2:#B79872;--green:#5B8C3E;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 700px at 18% -5%,rgba(232,181,84,0.22),transparent 55%),
    radial-gradient(900px 600px at 100% 10%,rgba(139,90,43,0.16),transparent 60%),
    radial-gradient(800px 600px at 50% 100%,rgba(201,146,59,0.18),transparent 60%),
    var(--bg);
  color:var(--txt);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.55;
}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 60px;}
.logo-cuadro{display:flex;justify-content:center;margin:0 auto 24px;width:120px;height:120px;border-radius:16px;background:#fff;border:1.5px solid rgba(201,146,59,0.35);box-shadow:0 4px 14px rgba(61,36,24,0.10);overflow:hidden;}
.logo-cuadro img{width:100%;height:100%;object-fit:contain;padding:6px;}
.head{text-align:center;margin-bottom:28px;}
.head .tag{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--em-3);font-weight:800;margin-bottom:10px;}
.head h1{font-family:'Lora',serif;font-size:clamp(28px,5vw,40px);font-weight:900;color:var(--brand-dark);line-height:1.1;}
.head h1 em{font-style:normal;color:var(--em-3);}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 14px;border-radius:99px;background:rgba(91,140,62,0.12);border:1px solid rgba(91,140,62,0.35);font-size:12px;font-weight:700;color:var(--green);}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px;}
.stat{padding:22px 18px;border-radius:18px;text-align:center;border:1px solid var(--brd-gold);background:linear-gradient(180deg,rgba(255,250,238,0.92),rgba(248,234,208,0.85));box-shadow:0 14px 36px -16px rgba(61,36,24,0.30);}
.stat .num{font-family:'Lora',serif;font-size:clamp(34px,7vw,52px);font-weight:900;color:var(--brand-dark);line-height:1;font-variant-numeric:tabular-nums;}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--em-3);font-weight:700;margin-top:8px;}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px;}
.list-head .t{font-family:'Lora',serif;font-size:20px;font-weight:700;color:var(--brand-dark);}
.list-head .c{font-size:13px;color:var(--mu);font-weight:600;}
.cards{display:flex;flex-direction:column;gap:10px;}
.guest{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.55);background:linear-gradient(180deg,rgba(255,250,238,0.92),rgba(248,234,208,0.80));box-shadow:0 8px 22px -14px rgba(61,36,24,0.30);animation:slideIn .4s ease both;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.guest .av{flex:0 0 46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--em-2),var(--em-3));display:grid;place-items:center;color:#fff;font-family:'Lora',serif;font-weight:900;font-size:19px;box-shadow:0 6px 16px rgba(201,146,59,0.30);}
.guest .info{flex:1;min-width:0;}
.guest .nm{font-family:'Lora',serif;font-size:17px;font-weight:700;color:var(--brand-dark);line-height:1.2;}
.guest .meta{font-size:12px;color:var(--mu);margin-top:2px;}
.guest .badge{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:rgba(91,140,62,0.12);border:1px solid rgba(91,140,62,0.30);font-size:12px;font-weight:700;color:var(--green);}
.guest .badge svg{width:13px;height:13px;}
.guest .grp{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:rgba(201,146,59,0.12);border:1px solid var(--brd-gold);font-size:12px;font-weight:700;color:var(--em-3);}
.empty{text-align:center;padding:50px 20px;color:var(--mu);}
.empty .ic{font-size:42px;margin-bottom:12px;}
.foot{text-align:center;margin-top:30px;font-size:12px;color:var(--mu);}
.spin{width:34px;height:34px;border:3px solid rgba(201,146,59,0.25);border-top-color:var(--em);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto;}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:520px){
  .guest{flex-wrap:wrap;gap:10px;}
  .guest .info{flex:1 1 60%;}
  .guest .grp,.guest .badge{flex:0 0 auto;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-cuadro"><img src="../img/logo.png?v=3" alt="Típicos"></div>
  <div class="head">
    <div class="tag">Pre-lanzamiento · 6 de junio</div>
    <h1>Invitados <em>Confirmados</em></h1>
    <div class="live"><span class="dot"></span>En vivo · se actualiza solo</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="st-conf">0</div><div class="lbl">Confirmaciones</div></div>
    <div class="stat"><div class="num" id="st-people">0</div><div class="lbl">Personas en total</div></div>
  </div>
  <div class="list-head"><div class="t">Lista de confirmados</div><div class="c" id="last-upd"></div></div>
  <div id="content"><div class="spin"></div></div>
  <div class="foot">Típicos · Santa Cruz de la Sierra · Hotel Yotau</div>
</div>
<script>
var SHEETS_URL='https://script.google.com/macros/s/AKfycbz9TmKHgtixd_Z3k4dJhz07GgFBU4Nx4ZG3CqjIIYTuTRDt4EWKwUtojozTkartuAprjQ/exec';
var cbCount=0;

function fetchData(){
  var cb='__cb'+(cbCount++);
  window[cb]=function(data){
    render(data);
    try{delete window[cb];}catch(e){window[cb]=undefined;}
    var s=document.getElementById('jsonp-'+cb);
    if(s)s.remove();
  };
  var s=document.createElement('script');
  s.id='jsonp-'+cb;
  s.src=SHEETS_URL+'?action=list&callback='+cb+'&_='+Date.now();
  s.onerror=function(){ try{delete window[cb];}catch(e){} s.remove(); };
  document.body.appendChild(s);
}

function inviteLabel(v){
  v=String(v||'').toLowerCase().trim();
  if(v===''||v==='solo')return {txt:'Va solo/a',extra:0};
  var n=parseInt(v,10);
  if(isNaN(n))return {txt:'Va solo/a',extra:0};
  return {txt:'+'+n+(n===1?' invitado':' invitados'),extra:n};
}

function initial(nombre){
  nombre=(nombre||'?').trim();
  return nombre.charAt(0).toUpperCase()||'?';
}

function fmtFecha(f){
  try{
    var d=new Date(f);
    if(isNaN(d.getTime()))return '';
    return d.toLocaleDateString('es-BO',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function render(rows){
  rows=(rows||[]).filter(function(r){return r.nombre && String(r.nombre).trim()!=='';});
  rows.reverse();

  var totalConf=rows.length;
  var totalPeople=0;
  rows.forEach(function(r){ totalPeople += 1 + inviteLabel(r.invitados).extra; });

  animateNum('st-conf',totalConf);
  animateNum('st-people',totalPeople);

  var content=document.getElementById('content');
  if(totalConf===0){
    content.innerHTML='<div class="empty"><div class="ic">&#9749;</div>Todav&iacute;a no hay confirmaciones.<br>Apenas alguien confirme, aparece ac&aacute; al instante.</div>';
    document.getElementById('last-upd').textContent='';
    return;
  }

  var html='<div class="cards">';
  rows.forEach(function(r,i){
    var inv=inviteLabel(r.invitados);
    var fecha=fmtFecha(r.fecha);
    html+='<div class="guest" style="animation-delay:'+Math.min(i*0.04,0.6)+'s">'
      +'<div class="av">'+esc(initial(r.nombre))+'</div>'
      +'<div class="info"><div class="nm">'+esc(r.nombre)+'</div>'
      +(fecha?'<div class="meta">Confirm&oacute; el '+fecha+'</div>':'')+'</div>'
      +'<div class="grp">'+inv.txt+'</div>'
      +'<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>OK</div>'
      +'</div>';
  });
  html+='</div>';
  content.innerHTML=html;

  var now=new Date();
  document.getElementById('last-upd').textContent='Actualizado '+now.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

var numCache={};
function animateNum(id,target){
  var el=document.getElementById(id);
  var start=numCache[id]||0;
  if(start===target){el.textContent=target;return;}
  var dur=600,t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/dur,1);
    el.textContent=Math.round(start+(target-start)*p);
    if(p<1)requestAnimationFrame(step);
    else numCache[id]=target;
  }
  requestAnimationFrame(step);
}

fetchData();
setInterval(fetchData,8000);
</script>
</body></html>
