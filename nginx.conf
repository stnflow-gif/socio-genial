server {
    listen 80;
    root /usr/share/nginx/html;
    index socio-genial.html index.html;

    # App vieja eliminada -> manda al app nuevo (por si quedo algun link viejo)
    location = /tu-cuenta.html { return 301 https://sociogenial.stnflow.online/app; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Evita errores 500 en archivos que no existen
    error_page 404 /index.html;

    # Compresión
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
